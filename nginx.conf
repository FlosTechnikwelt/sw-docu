server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus liefert eine eigene 404-Seite mit
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Statische Assets mit Hash im Dateinamen dürfen lange gecacht werden
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
